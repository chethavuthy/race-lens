name: Benchmark pipeline

# Speed + equivalence measurement for the per-photo indexing pipeline.
#
# Runs on ubuntu-latest because that is the machine the real pass runs on, and
# both numbers this produces are machine-specific: timings obviously, but also
# the EXACT bib and embedding values, which differ between CPU architectures at
# the last bits. A benchmark run on a laptop proves nothing about either.
#
# This workflow writes nothing to D1, R2 or the API — it takes only
# GOOGLE_API_KEY, reads a Drive folder, and uploads a JSON artifact. It is safe
# to run while a real indexing pass is in flight. The one resource it shares
# with a live pass is Drive download quota, which is why the photo cache below
# matters: the first run pays for the downloads and every later run is free.

on:
  workflow_dispatch:
    inputs:
      folder_id:
        description: Drive folder id to sample
        required: true
      sample:
        description: How many photos to benchmark
        default: '40'
      label:
        description: Name for this run (e.g. baseline, parallel-workers)
        required: true
      workers:
        description: Worker processes (1 until optimisation 1 lands)
        default: '1'
      threads:
        description: >
          onnxruntime threads per process. Leave empty for the library default.
          A parallel run must set this to 1 — N workers each spawning 4 intra-op
          threads on a 4 vCPU runner spend more time contending than working.
          It is also the one knob that could plausibly change results rather than
          just timing, so it is recorded in the report and compared explicitly.
        default: ''
      b_workers:
        description: >
          Second variant's worker count. Set this (with b_threads) to run TWO
          configurations back to back in ONE job, on ONE machine, and diff them.
          That is the only way to see an effect smaller than the ~19% spread
          between runners — measured, by running the identical config twice and
          getting 6.29 and 7.48 s/photo.
        default: ''
      b_threads:
        description: Second variant's onnxruntime threads (empty = library default)
        default: ''
      single_decode:
        description: Which variants decode once (optimisation 2)? none / a / b / both
        default: none
      interleave:
        description: >
          Download inside the pass, per batch, the way production runs it.
          Required to measure optimisation 3 at all — with the default
          up-front fetch there is nothing left for the overlap to overlap.
        type: choice
        options: ["no", "yes"]
        default: 'no'
      a_prefetch:
        description: Variant A read-ahead depth (0 = today's turn-taking)
        default: '0'
      b_prefetch:
        description: Variant B read-ahead depth (0 = today's turn-taking)
        default: '0'
      no_cache:
        description: >
          Download for real instead of reusing the cached photos. Needed for a
          download measurement; each variant gets its OWN directory so the
          second cannot find the first's files and report a cost of zero.
        type: choice
        options: ["no", "yes"]
        default: 'no'
      image_source:
        description: Drive's resized copy, or the full original
        type: choice
        options: [thumb, original]
        default: thumb

# One at a time. Two benchmark runs on the same runner class would still be
# isolated, but they would compete for Drive quota with each other and with any
# live indexing pass — and a timing measured under that competition is noise.
concurrency:
  group: bench-pipeline
  cancel-in-progress: false

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: indexer/requirements.txt

      - name: Cache insightface models
        uses: actions/cache@v4
        with:
          path: ~/.insightface/models
          key: insightface-buffalo_s-v1

      # Keyed on folder + sample + source, NOT on the commit: the whole point is
      # that every commit under test benchmarks the identical bytes. A cache
      # miss here does not fail the run, it just spends Drive quota once.
      - name: Cache benchmark photos
        uses: actions/cache@v4
        with:
          path: /tmp/bench-cache
          key: bench-photos-${{ inputs.folder_id }}-${{ inputs.sample }}-${{ inputs.image_source }}

      - name: Install system libs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libglib2.0-0

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r indexer/requirements.txt

      - name: Benchmark
        env:
          # Inputs reach the shell as environment variables, never as script
          # text — see the note in index-event.yml. The same reasoning applies
          # here even though this workflow holds only one secret.
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          # Unbuffered, so the per-photo heartbeat reaches the log as it happens
          # rather than at exit. A run that is stuck and a run that is merely
          # slow look identical until the lines arrive.
          PYTHONUNBUFFERED: '1'
          FOLDER_ID: ${{ inputs.folder_id }}
          SAMPLE: ${{ inputs.sample }}
          LABEL: ${{ inputs.label }}
          WORKERS: ${{ inputs.workers }}
          IMAGE_SOURCE: ${{ inputs.image_source }}
          THREADS: ${{ inputs.threads }}
          B_WORKERS: ${{ inputs.b_workers }}
          B_THREADS: ${{ inputs.b_threads }}
          SINGLE_DECODE: ${{ inputs.single_decode }}
          INTERLEAVE: ${{ inputs.interleave }}
          A_PREFETCH: ${{ inputs.a_prefetch }}
          B_PREFETCH: ${{ inputs.b_prefetch }}
          NO_CACHE: ${{ inputs.no_cache }}
        run: |
          # Which CPU this run drew. Runners are not one machine type, and that
          # is the leading suspect for both the timing spread between runs and
          # the float drift in the embeddings. Without it, a differing pair of
          # runs is uninterpretable.
          echo "=== runner CPU ==="
          grep -m1 'model name' /proc/cpuinfo || true
          nproc

          run_variant() {
            local label="$1" workers="$2" threads="$3" which="$4"
            local sd="" net=""
            case "$SINGLE_DECODE" in
              both) sd="--single-decode" ;;
              a) [ "$which" = a ] && sd="--single-decode" ;;
              b) [ "$which" = b ] && sd="--single-decode" ;;
            esac
            if [ "$INTERLEAVE" = yes ]; then
              local depth="$A_PREFETCH"
              [ "$which" = b ] && depth="$B_PREFETCH"
              # Validated rather than trusted: these reach a command line, and
              # the note at the top of index-event.yml is about exactly this.
              case "$depth" in ''|*[!0-9]*) echo "bad prefetch depth"; exit 1 ;; esac
              net="--interleave --prefetch $depth"
              [ "$NO_CACHE" = yes ] && net="$net --no-cache"
            fi
            if [ -n "$threads" ]; then
              export OMP_NUM_THREADS="$threads" OPENBLAS_NUM_THREADS="$threads" \
                     MKL_NUM_THREADS="$threads"
            else
              unset OMP_NUM_THREADS OPENBLAS_NUM_THREADS MKL_NUM_THREADS
            fi
            echo "=== variant $label: workers=$workers threads=${threads:-default} ==="
            python -m indexer.bench_pipeline \
              --folder-id     "$FOLDER_ID" \
              --sample        "$SAMPLE" \
              --label         "$label" \
              --workers       "$workers" \
              --image-source  "$IMAGE_SOURCE" \
              --cache         /tmp/bench-cache \
              --out           "bench-$label.json" \
              $sd $net
          }

          run_variant "$LABEL" "$WORKERS" "$THREADS" a

          # Both variants on ONE machine, so the comparison is paired and the
          # machine cancels out of it.
          if [ -n "$B_WORKERS" ]; then
            run_variant "$LABEL-b" "$B_WORKERS" "$B_THREADS" b
            echo "=== paired diff (same runner, same photos) ==="
            python3 tools/bench_diff.py "bench-$LABEL.json" "bench-$LABEL-b.json" || true
          fi

      # Self-consistency is checked on every run, before any human looks at the
      # numbers. It needs only this one report: each face records both its
      # row_idx and its own embedding hash, so a face pointing at the wrong
      # vector is detectable without a baseline to compare against. That failure
      # is silent in production — face search just returns strangers — so it is
      # a gate here rather than a note in the log.
      - name: Check row_idx/embedding self-consistency
        env:
          LABEL: ${{ inputs.label }}
        run: python3 tools/bench_diff.py "bench-$LABEL.json"

      - uses: actions/upload-artifact@v4
        with:
          name: bench-${{ inputs.label }}
          path: bench-*.json
          retention-days: 30

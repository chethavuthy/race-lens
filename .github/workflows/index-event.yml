name: Index event

on:
  repository_dispatch:
    types: [index-event, benchmark-folder]
  workflow_dispatch:
    inputs:
      event_id: { description: Event id, required: true }
      source_id: { description: Source id, required: true }
      folder_id: { description: Drive folder id, required: true }
      job_id: { description: Job id, required: true }
      bibs_only:
        description: Re-read bibs only (leaves faces/shards untouched)
        type: boolean
        default: false
      no_resume:
        description: Re-process photos already indexed (for a full rebuild)
        type: boolean
        default: false
      rebuild:
        description: Resume on photos that already have faces (use after wiping)
        type: boolean
        default: false
      image_source:
        description: Download full originals, or Drive's ~12x smaller resized copy
        type: choice
        options: [original, thumb]
        default: original

# Two runs against the same event would race on row allocation and photo
# upserts. Queue them instead of cancelling — a cancelled run leaves a job
# stuck in "running" forever.
concurrency:
  group: index-${{ github.event.client_payload.event_id || inputs.event_id }}
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: indexer/requirements.txt

      # The insightface model pack is ~100 MB and is otherwise re-downloaded on
      # every single run.
      - name: Cache insightface models
        uses: actions/cache@v4
        with:
          path: ~/.insightface/models
          key: insightface-buffalo_s-v1

      # opencv-python-headless still needs libglib; libgl is no longer required
      # now that paddlepaddle is gone.
      - name: Install system libs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libglib2.0-0

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r indexer/requirements.txt

      - name: Free up disk
        # Runners ship ~25 GB of preinstalled toolchains we never touch.
        # Reclaiming it roughly doubles the album size a single run can hold.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h /

      # NOTE ON EVERY `env:` BLOCK BELOW
      #
      # Dispatch inputs reach the shell as environment variables, never as script
      # text. `${{ ... }}` is substituted BEFORE bash sees the line, so a value
      # containing `"; curl … | sh; "` used to execute on a runner holding
      # GOOGLE_API_KEY, INGEST_SECRET and the R2 write credentials.
      #
      # Nothing is known to be exploitable today: every field is either newId()-
      # generated or charset-validated by parseFolderId. The exception was
      # only_file, which comes from photos.drive_file_id — a column the internal
      # API accepted verbatim until it started validating it. That is one
      # unvalidated column of margin, and the authentication in front of it was
      # itself broken (see AUDIT.md S1). Indirection costs nothing and does not
      # depend on either guard holding.
      - name: Benchmark folder (thumbnail vs original)
        if: github.event.action == 'benchmark-folder'
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          BENCHMARK_ID: ${{ github.event.client_payload.benchmark_id }}
          FOLDER_ID: ${{ github.event.client_payload.folder_id }}
          SAMPLE: ${{ github.event.client_payload.sample || 6 }}
        run: |
          python -m indexer.benchmark \
            --benchmark-id "$BENCHMARK_ID" \
            --folder-id    "$FOLDER_ID" \
            --sample       "$SAMPLE"

      - name: Index
        if: github.event.action != 'benchmark-folder'
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          EVENT_ID:  ${{ github.event.client_payload.event_id  || inputs.event_id }}
          SOURCE_ID: ${{ github.event.client_payload.source_id || inputs.source_id }}
          FOLDER_ID: ${{ github.event.client_payload.folder_id || inputs.folder_id }}
          JOB_ID:    ${{ github.event.client_payload.job_id    || inputs.job_id }}
          IMAGE_SOURCE: ${{ github.event.client_payload.image_source || inputs.image_source || 'original' }}
          ONLY_FILE: ${{ github.event.client_payload.only_file || '' }}
          # These three resolve to one of two fixed literals, so they are the only
          # values deliberately left unquoted below — an empty string must expand to
          # no argument at all rather than to an empty one.
          FLAG_BIBS_ONLY: ${{ (github.event.client_payload.bibs_only || inputs.bibs_only) && '--bibs-only' || '' }}
          FLAG_NO_RESUME: ${{ (github.event.client_payload.no_resume || inputs.no_resume) && '--no-resume' || '' }}
          FLAG_REBUILD:   ${{ (github.event.client_payload.rebuild   || inputs.rebuild)   && '--rebuild'   || '' }}
        run: |
          python -m indexer.main \
            --event-id  "$EVENT_ID" \
            --source-id "$SOURCE_ID" \
            --folder-id "$FOLDER_ID" \
            --job-id    "$JOB_ID" \
            $FLAG_BIBS_ONLY $FLAG_NO_RESUME $FLAG_REBUILD \
            --image-source "$IMAGE_SOURCE" \
            --only-file "$ONLY_FILE"

      - name: Report failure
        # main.py reports its own exceptions, but this also catches the cases it
        # cannot: OOM, disk exhaustion, the 330-minute timeout, a cancelled run.
        # Without it the admin UI polls "running" forever.
        if: failure() || cancelled()
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          JOB_ID: ${{ github.event.client_payload.job_id || inputs.job_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # jq builds the JSON so the message cannot break out of the string it
          # sits in, and the URL arrives as data rather than as script text.
          jq -n --arg err "Runner job failed — see $RUN_URL" \
            '{status: "failed", error: $err}' \
          | curl -sS -X POST "$API_BASE_URL/api/internal/jobs/$JOB_ID/progress" \
              -H "X-Ingest-Secret: $INGEST_SECRET" \
              -H 'Content-Type: application/json' \
              --data-binary @-

name = "race-lens-api"
main = "src/index.ts"
compatibility_date = "2024-11-27"
compatibility_flags = ["nodejs_compat"]

# /api/* on the custom domains is served by this Worker, everything else by
# Pages. Same-origin is required for Cloudflare Access: its cookie is scoped to
# the host, so a cross-origin admin fetch would never send it.
# Declaring `routes` turns the workers.dev subdomain OFF by default. Keep it on:
# it is the API origin for *.pages.dev until the custom domain's DNS is live.
workers_dev = true

routes = [
  { pattern = "racelens.runlytics.fit/api/*",  zone_name = "runlytics.fit" },
  { pattern = "race-lens.runlytics.fit/api/*", zone_name = "runlytics.fit" },
]

# Public origin of the Pages frontend. Used for CORS.
[vars]
WEB_ORIGIN = "https://racelens.runlytics.fit,https://race-lens.runlytics.fit,https://race-lens.pages.dev"
# Public base for thumbnails/banners. Point this at a custom domain bound to the
# R2 bucket, or leave empty to serve bytes through the Worker at /r2/*.
# MUST be absolute. A relative "/r2/..." only works when the frontend and the
# Worker share an origin; on *.pages.dev they do not, and the SPA catch-all
# (/* -> /index.html 200) happily serves HTML for the image request, so every
# thumbnail silently failed to decode and rendered as "no longer available".
#
# Include the /r2 path: this points at the Worker's asset route, not at a custom
# domain bound directly to the bucket. With an R2 custom domain the keys sit at
# the root and this would have no path.
# Photos are served straight off R2's own custom domain, NOT through the Worker.
#
# Routing them through /r2/* meant one Worker invocation per thumbnail, and an
# event page loads 60 at a time — that path, not face search, is what put CPU
# over the included 30M ms. R2 egress is free and needs no compute.
#
# This bucket is public at that hostname, which is exactly why face-embedding
# shards were moved to race-lens-index: a custom domain publishes an ENTIRE
# bucket, so nothing private may ever live here.
R2_PUBLIC_BASE = "https://img.runlytics.fit"
# Set to "1" ONLY in .dev.vars for local work. Never in a deployed environment.
DEV_ADMIN_BYPASS = "0"

[[d1_databases]]
binding = "DB"
database_name = "race-lens"
database_id = "b2201d61-8877-4c6f-bf73-64b848c89db7"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "race-lens"

# Face-embedding shards live in their own bucket, and it must never be given a
# custom domain. An R2 custom domain publishes the WHOLE bucket, and BUCKET now
# has one (img.runlytics.fit) so thumbnails can be served without paying a
# Worker invocation each. Keeping the index separate is what makes that safe:
# these files are raw biometric vectors, one per detected face.
[[r2_buckets]]
binding = "INDEX_BUCKET"
bucket_name = "race-lens-index"

# Secrets (set with `wrangler secret put <NAME>`):
#   GOOGLE_API_KEY    — Drive API key, used by /api/admin/drive/inspect
#   INGEST_SECRET     — shared with the CI runner, checked on /api/internal/*
#   GH_DISPATCH_TOKEN — fine-grained PAT, Contents: read/write on this repo only
#   GH_REPO           — "owner/race-lens"
